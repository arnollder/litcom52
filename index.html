<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v4.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=4" />
    <meta name="theme-color" content="#1f8f5c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Литком М52" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Магазинчик Литком-НН — система заказа литературы Сообщества АН Нижнего Новгорода."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Литком НН</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('litcom52-theme')
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }

        const host = location.hostname
        const isAdmin = host === 'admin.litkom-m52.ru' || host.startsWith('admin.')
        if (!isAdmin) return

        const manifest = document.querySelector('link[rel="manifest"]')
        if (manifest) manifest.setAttribute('href', '/manifest-admin.webmanifest?v=3')

        const themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) themeColor.setAttribute('content', '#14532d')

        const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]')
        if (appleTitle) appleTitle.setAttribute('content', 'Админка М52')

        const description = document.querySelector('meta[name="description"]')
        if (description) {
          description.setAttribute('content', 'Админка М52 — заказы покупателей МойСклад.')
        }

        document.title = 'Админка М52'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
