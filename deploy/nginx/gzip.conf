# Enable gzip for common web assets (include from nginx.conf or conf.d/).
# Ubuntu default has gzip on but gzip_types commented out.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml;
