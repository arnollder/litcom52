# Extend Ubuntu's default gzip (already "gzip on") for JS/CSS/JSON.
# Do not redeclare "gzip on" — nginx treats it as duplicate.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml;
